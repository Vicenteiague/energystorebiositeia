  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen selection:bg-cyan-400 selection:text-slate-950 transition-colors duration-200">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('energy-stor3-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
